<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-STAR القرآن الكريم</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1b2a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: #1b263b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        h1 { color: #e0a96d; }
        .btn {
            background-color: #e0a96d;
            color: #0d1b2a;
            border: none;
            padding: 12px 20px;
            margin: 10px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        audio { width: 100%; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⭐ 7-STAR ⭐</h1>
        <p>مرحباً بك في تطبيق القرآن الكريم</p>
        <button class="btn">قراءة القرآن</button>
        <button class="btn">اختر القارئ</button>
        <audio controls>
            <source src="https://server8.mp3quran.net/afs/001.mp3" type="audio/mpeg">
            متصفحك لا يدعم مشغل الصوت.
        </audio>
    </div>
</body>
</html>
